
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | SmartQ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f4f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-container {
            background: white;
            padding: 55px 45px;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.07);
            text-align: center;
            max-width: 520px;
            width: 100%;
        }

        .error-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .error-code {
            font-size: 90px;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
        }

        h1 {
            font-size: 25px;
            color: #1e293b;
            margin-top: 18px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.7;
            margin-top: 15px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 22px;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-primary {
            background: #2563eb;
            color: white;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .footer {
            margin-top: 35px;
            color: #94a3b8;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .error-container {
                padding: 35px 20px;
            }

            .error-code {
                font-size: 70px;
            }
        }
    </style>
</head>

<body>
    <main class="error-container">

        <div class="error-icon">⚠️</div>

        <div class="error-code">500</div>

        <h1>Internal Server Error</h1>

        <p>
            Something went wrong on our side.
            We're unable to process your request right now.
            Please try again in a few moments.
        </p>

        <div class="buttons">
            <button class="btn btn-secondary"
                    onclick="window.location.reload()">
                Try Again
            </button>

            <a href="/" class="btn btn-primary">
                Return Home
            </a>
        </div>

        <div class="footer">
            SmartQ &bull; Queue Management System
        </div>

    </main>
</body>
</html>
