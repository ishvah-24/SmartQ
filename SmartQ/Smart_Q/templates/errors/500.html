
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | SmartQ</title>
    <link rel="stylesheet" href="{% static 'Smart_Q/css/errors.css' %}">
</head>
<body>
    <main class="error-card">

        <img
            src="{% static 'Smart_Q/images/smartq-logo.jpg' %}"
            alt="SmartQ Logo"
            class="error-logo"
        >

        <div class="error-code">500</div>

        <h1 class="error-title">Something Went Wrong</h1>

        <p class="error-description">
            We're experiencing an unexpected server error.
            Please try again in a few moments.
            If the problem continues, contact support.
        </p>

        <a href="/" class="error-button">
            Return to Home
        </a>

        <div class="error-footer">
            SmartQ • Queue Management System
        </div>

    </main>
</body>
</html>
